<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>

<style>
body{
  background:#0b1220;
  font-family:Arial;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#111a2e;
  padding:20px;
  border-radius:12px;
  width:300px;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}

button{
  background:#22c55e;
  color:white;
}
</style>
</head>

<body>

<div class="box">
<h2>Admin Login</h2>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>
</div>

<script>
function login(){
  const email=document.getElementById("email").value;
  const pass=document.getElementById("pass").value;

  if(email==="admin" && pass==="admin123"){
    window.location.href="dashboard.html";
  } else {
    alert("Wrong login");
  }
}
</script>

</body>
</html>
