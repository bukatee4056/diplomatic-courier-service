<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      grid-column: span 3;
      padding: 12px;
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #0b3d91;
      color: white;
    }

    .actions button {
      padding: 5px 8px;
      margin-right: 5px;
      font-size: 12px;
    }

    .delete {
      background: red;
      color: white;
      border: none;
      border-radius: 4px;
    }

    .edit {
      background: green;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📦 Admin Dashboard</h2>

  <div class="form">

    <input id="tracking" placeholder="Tracking Number">
    <input id="customerName" placeholder="Customer Name">
    <input id="phone" placeholder="Phone Number">

    <input id="address" placeholder="House Address">
    <input id="location" placeholder="Current Location">
    <input id="destination" placeholder="Destination">

    <input id="status" placeholder="Status">
    <input id="eta" placeholder="ETA">
    <input id="shippedDate" placeholder="Shipped Date">

    <button id="saveBtn">Save Shipment</button>

  </div>

  <table>
    <thead>
      <tr>
        <th>Tracking</th>
        <th>Customer</th>
        <th>Phone</th>
        <th>Location</th>
        <th>Destination</th>
        <th>Status</th>
        <th>ETA</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="list"></tbody>
  </table>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
