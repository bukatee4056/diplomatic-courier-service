<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Production Logistics Control Center</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

.header{
  padding:15px;
  background:#111a2e;
  text-align:center;
}

.container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
}

.card{
  background:#111a2e;
  padding:15px;
  border-radius:12px;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
}

button{
  cursor:pointer;
  font-weight:bold;
}

.create{background:#22c55e;color:white}
.update{background:#3b82f6;color:white}
.delete{background:#ef4444;color:white}

.shipment{
  background:#0f172a;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
}

#map{
  height:250px;
  margin-top:10px;
  border-radius:10px;
}

.error{
  color:#ff6b6b;
  font-size:13px;
}
</style>
</head>

<body>

<div class="header">
<h2>📦 Production Logistics System</h2>
</div>

<div class="container">

<!-- CREATE -->
<div class="card">
<h3>➕ Create Shipment</h3>

<div id="err" class="error"></div>

<input id="id" placeholder="Tracking ID (or leave blank for auto)">
<input id="customer" placeholder="Customer Name">
<input id="phone" placeholder="Phone">
<input id="location" placeholder="Origin (e.g. Yemen)">
<input id="destination" placeholder="Destination (e.g. Egypt)">
<input id="address" placeholder="Address">
<input id="status" placeholder="Status (Order Confirmed / In Transit)">
<input id="eta" placeholder="ETA">
<input id="shipped" placeholder="Shipped Date">
<input id="route" placeholder="Route (e.g. yemen,egypt,nigeria)">

<button class="create" onclick="createShipment()">Create Shipment</button>

<div id="map"></div>
</div>

<!-- LIST -->
<div class="card">
<h3>📦 Shipments</h3>
<div id="list"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
doc,
setDoc,
getDocs,
updateDoc,
deleteDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyAwjcKxnViESMXyCzhML2sZPbA_HBzytMg",
authDomain: "diplomatic-courier-service.firebaseapp.com",
projectId: "diplomatic-courier-service"
});

const db = getFirestore(app);

/* ---------------- ROUTE MAP ---------------- */
const geo = {
"yemen":[15.3694,44.1910],
"saudi arabia":[24.7136,46.6753],
"egypt":[30.0444,31.2357],
"nigeria":[6.5244,3.3792],
"ethiopia":[9.1450,40.4897],
"sudan":[15.5007,32.5599],
"jordan":[31.9632,35.9304]
};

let map;
let marker;
let polyline;

/* ---------------- MAP ---------------- */
function drawMap(route){

if(!route || route.length < 2) return;

if(map) map.remove();

/* Convert route names to coordinates */
const coords = route
  .map(r => geo[r.trim().toLowerCase()])
  .filter(Boolean);

/* If route is invalid, stop */
if(coords.length < 2){
  console.log("Invalid route");
  return;
}

/* 🚨 FORCE MAP TO USE WORLD VIEW (NO USER LOCATION EVER) */
map = L.map("map", {
  center: [20, 0],   // fixed neutral world center
  zoom: 2,
  zoomControl: true,
  attributionControl: true
});

/* Load tiles */
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "Logistics System"
}).addTo(map);

/* Draw route line ONLY */
polyline = L.polyline(coords, {
  color: "cyan",
  weight: 4
}).addTo(map);

/* Start marker at origin ONLY */
marker = L.marker(coords[0]).addTo(map);

/* Fit ONLY route bounds (not user location) */
map.fitBounds(polyline.getBounds(), {
  padding: [30, 30]
});

}

/* ---------------- CREATE (PRODUCTION SAFE) ---------------- */
window.createShipment = async () => {

const err = document.getElementById("err");
err.innerText = "";

try {

const idInput = document.getElementById("id").value.trim();
const id = idInput || "TRK-" + Date.now();

const route = document.getElementById("route").value.split(",");

if(route.length < 2){
err.innerText = "Route must include at least 2 countries";
return;
}

const data = {
customerName: document.getElementById("customer").value || "N/A",
phone: document.getElementById("phone").value || "N/A",
location: document.getElementById("location").value || "N/A",
destination: document.getElementById("destination").value || "N/A",
address: document.getElementById("address").value || "N/A",
status: document.getElementById("status").value || "Order Confirmed",
eta: document.getElementById("eta").value || "N/A",
shippedDate: document.getElementById("shipped").value || "N/A",
route,
updatedAt: Date.now()
};

await setDoc(doc(db,"shipments",id),data);

alert("Shipment Created ✔");

load();

} catch(e){
console.error(e);
alert("Failed to save shipment (check Firebase rules)");
}
};

/* ---------------- LOAD ---------------- */
async function load(){

const snap = await getDocs(collection(db,"shipments"));

list.innerHTML = "";

snap.forEach(d=>{

const data = d.data();

list.innerHTML += `
<div class="shipment">

<h4>${d.id}</h4>

<input id="c-${d.id}" value="${data.customerName||""}">
<input id="p-${d.id}" value="${data.phone||""}">
<input id="l-${d.id}" value="${data.location||""}">
<input id="d-${d.id}" value="${data.destination||""}">
<input id="a-${d.id}" value="${data.address||""}">
<input id="s-${d.id}" value="${data.status||""}">
<input id="e-${d.id}" value="${data.eta||""}">
<input id="sd-${d.id}" value="${data.shippedDate||""}">
<input id="r-${d.id}" value="${(data.route||[]).join(",")}">

<button class="update" onclick="update('${d.id}')">✏ Update</button>
<button class="delete" onclick="removeItem('${d.id}')">🗑 Delete</button>
<button onclick="preview('${d.id}')">🗺 View Route</button>

</div>
`;
});

}

/* ---------------- UPDATE ---------------- */
window.update = async (id) => {

await updateDoc(doc(db,"shipments",id),{
customerName: document.getElementById("c-"+id).value,
phone: document.getElementById("p-"+id).value,
location: document.getElementById("l-"+id).value,
destination: document.getElementById("d-"+id).value,
address: document.getElementById("a-"+id).value,
status: document.getElementById("s-"+id).value,
eta: document.getElementById("e-"+id).value,
shippedDate: document.getElementById("sd-"+id).value,
route: document.getElementById("r-"+id).value.split(","),
updatedAt: Date.now()
});

alert("Updated ✔");
load();
};

/* ---------------- DELETE ---------------- */
window.removeItem = async (id) => {
if(confirm("Delete shipment?")){
await deleteDoc(doc(db,"shipments",id));
load();
}
};

/* ---------------- MAP PREVIEW ---------------- */
window.preview = async (id) => {

const snap = await getDoc(doc(db,"shipments",id));
const data = snap.data();

drawMap(data.route);
};

load();

</script>

</body>
</html>
