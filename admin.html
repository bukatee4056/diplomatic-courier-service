<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6fb;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 6px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      text-align: left;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>👨‍💼 Admin Dashboard</h2>

  <input id="tracking" placeholder="Tracking Number">
  <input id="status" placeholder="Status">
  <input id="location" placeholder="Location">
  <input id="destination" placeholder="Destination">
  <input id="eta" placeholder="ETA">
  <input id="shippedDate" placeholder="Shipped Date">

  <input id="customerName" placeholder="Customer Name">
  <input id="phone" placeholder="Phone Number">
  <input id="address" placeholder="House Address">

  <button id="saveBtn">Save Shipment</button>

  <p id="msg"></p>

  <hr>

  <h3>📦 Shipments</h3>
  <div id="list"></div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
