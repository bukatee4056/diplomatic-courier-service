<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Courier Admin Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #0b1220;
      color: white;
      padding: 20px;
    }

    .box {
      background: #111a2e;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      border: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #2d6cdf;
      border: none;
      color: white;
      cursor: pointer;
      margin-top: 5px;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111a2e;
    }

    th, td {
      border: 1px solid #222;
      padding: 10px;
    }

    th {
      background: #1b2a4a;
    }

    h2, h3 {
      margin-top: 0;
    }
  </style>
</head>

<body>

<h2>📦 Enterprise Courier Dashboard</h2>

<div class="box">

  <h3>Create / Update Shipment</h3>

  <!-- TRACKING NUMBER -->
  <input id="tracking" placeholder="Tracking Number (e.g. DCS1001)">

  <!-- STATUS -->
  <select id="status">
    <option>Pending</option>
    <option>Processing</option>
    <option>In Transit</option>
    <option>Delivered</option>
  </select>

  <!-- LOCATION -->
  <input id="location" placeholder="Current Location">

  <!-- DESTINATION -->
  <input id="destination" placeholder="Destination Country">

  <!-- ETA -->
  <input id="eta" placeholder="ETA (e.g. June 29, 2026)">

  <!-- ROUTE (IMPORTANT NEW FIELD) -->
  <input id="route" placeholder="Route (comma separated: New York, London, Cairo, Lagos)">

  <button id="saveBtn">Save Shipment</button>

  <hr>

  <h3>Search Shipment</h3>

  <input id="search" placeholder="Enter Tracking Number">
  <button id="searchBtn">Search</button>

  <p id="msg"></p>
</div>

<div class="box">

  <h3>All Shipments</h3>

  <table>
    <thead>
      <tr>
        <th>Tracking</th>
        <th>Status</th>
        <th>Location</th>
        <th>Destination</th>
        <th>ETA</th>
      </tr>
    </thead>

    <tbody id="tableBody"></tbody>
  </table>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
