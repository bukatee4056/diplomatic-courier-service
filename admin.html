<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    h2 {
      text-align: center;
    }

    .form {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      grid-column: span 3;
      padding: 12px;
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      font-size: 13px;
    }

    th {
      background: #0b3d91;
      color: white;
    }

    .actions button {
      padding: 5px 8px;
      font-size: 12px;
      margin-right: 5px;
    }

    .delete { background: red; color: white; border: none; }
    .edit { background: green; color: white; border: none; }
    .pdf { background: black; color: white; border: none; }

    #map {
      height: 300px;
      margin-top: 20px;
      border-radius: 10px;
    }
  </style>

  <!-- MAP -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="container">

  <h2>📦 Logistics Admin Dashboard</h2>

  <div class="form">

    <input id="tracking" placeholder="Tracking Number">
    <input id="customerName" placeholder="Customer Name">
    <input id="phone" placeholder="Phone Number">

    <input id="address" placeholder="Address">
    <input id="location" placeholder="Location">
    <input id="destination" placeholder="Destination">

    <input id="status" placeholder="Status">
    <input id="eta" placeholder="ETA">
    <input id="shippedDate" placeholder="Shipped Date">

    <button id="saveBtn">Save Shipment</button>

  </div>

  <table>
    <thead>
      <tr>
        <th>Tracking</th>
        <th>Customer</th>
        <th>Phone</th>
        <th>Status</th>
        <th>Route</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="list"></tbody>
  </table>

  <h3>📍 Live Route Map</h3>
  <div id="map"></div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
