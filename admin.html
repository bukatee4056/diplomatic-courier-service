<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Logistics Control Center</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

.header{
  padding:20px;
  background:#111a2e;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:20px;
}

.card{
  background:#111a2e;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.form{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:20px;
}

input{
  padding:10px;
  border:none;
  border-radius:6px;
}

button{
  grid-column:span 3;
  padding:12px;
  background:#f5c542;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #1f2937;
}
</style>
</head>

<body>

<div class="header">
<h2>📊 Logistics Control Center</h2>
</div>

<div class="grid">
<div class="card"><h3 id="total">0</h3><p>Total</p></div>
<div class="card"><h3 id="transit">0</h3><p>In Transit</p></div>
<div class="card"><h3 id="delivered">0</h3><p>Delivered</p></div>
<div class="card"><h3 id="pending">0</h3><p>Pending</p></div>
</div>

<div class="form">

<input id="tracking" placeholder="Tracking ID">
<input id="customerName" placeholder="Customer Name">
<input id="phone" placeholder="Phone">
<input id="address" placeholder="Address">
<input id="eta" placeholder="ETA">
<input id="shippedDate" placeholder="Shipped Date">

<button id="saveBtn">Save Shipment</button>

</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Customer</th>
<th>Status</th>
<th>Progress</th>
</tr>
</thead>

<tbody id="list"></tbody>
</table>

<script type="module" src="admin.js"></script>

</body>
</html>
