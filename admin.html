<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <style>
    body { font-family: Arial; background:#f4f4f4; padding:20px; }
    .box { background:white; padding:20px; border-radius:10px; margin-bottom:20px; }
    input { padding:10px; margin:5px; width:100%; }
    button { padding:10px; margin:5px; cursor:pointer; }

    table {
      width:100%;
      border-collapse: collapse;
      background:white;
    }

    th, td {
      border:1px solid #ddd;
      padding:10px;
      text-align:left;
    }

    th { background:#0b1f3a; color:white; }
    .btn { margin-right:5px; }
  </style>
</head>

<body>

<h2>📦 DHL-Style Admin Dashboard</h2>

<div class="box">
  <h3>Create / Update Shipment</h3>

  <input id="tracking" placeholder="Tracking Number">
  <input id="status" placeholder="Status">
  <input id="location" placeholder="Location">
  <input id="destination" placeholder="Destination">
  <input id="eta" placeholder="ETA">

  <button id="saveBtn">Save Shipment</button>
  <p id="msg"></p>
</div>

<div class="box">
  <h3>All Shipments</h3>
  <table>
    <thead>
      <tr>
        <th>Tracking</th>
        <th>Status</th>
        <th>Location</th>
        <th>Destination</th>
        <th>ETA</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script type="module" src="admin.js"></script>

</body>
</html>
