<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Logistics Control Center</title>

<style>
body{
  font-family:Arial;
  background:#0b1220;
  color:white;
  margin:0;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111a2e;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
}

input, button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
}

button{
  cursor:pointer;
  font-weight:bold;
}

.edit{background:#22c55e;color:white}
.delete{background:#ef4444;color:white}
.update{background:#3b82f6;color:white}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.small{
  font-size:12px;
  color:#9aa4b2;
}
</style>
</head>

<body>

<div class="container">

<h2>📦 Logistics Control Center</h2>

<div id="list"></div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
