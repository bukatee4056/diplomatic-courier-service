<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Track Shipment</title>

  <style>
    body {
      font-family: Arial;
      background: #0b1220;
      color: white;
      text-align: center;
      padding: 20px;
    }

    input, button {
      padding: 10px;
      width: 80%;
      margin: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #2d6cdf;
      color: white;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
    }

    #map {
      height: 300px;
      margin-top: 20px;
      border-radius: 10px;
    }
  </style>

  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

<h2>📦 Track Your Shipment</h2>

<input id="trackingInput" placeholder="Enter Tracking Number">
<button id="trackBtn">Track Package</button>

<div id="result"></div>

<div id="map"></div>

<script type="module" src="app.js"></script>

</body>
</html>
