<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Track Shipment</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f7fb;
      padding: 25px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
    }

    button {
      background: #0b3d91;
      color: white;
      border: none;
    }

    #map {
      height: 250px;
      margin-top: 15px;
    }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

<div class="container">

  <h2>📦 Customer Tracking</h2>

  <input id="trackingInput" placeholder="Enter Tracking Number">
  <button id="trackBtn">Track</button>

  <div id="result"></div>

  <div id="map"></div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
