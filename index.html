<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Track Shipment</title>

  <style>
    body {
      font-family: Arial;
      background: #0b1220;
      margin: 0;
      padding: 20px;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .box {
      background: white;
      color: black;
      padding: 20px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #ffcc00;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .card {
      margin-top: 20px;
      background: white;
      color: black;
      padding: 20px;
      border-radius: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #f4f6f9;
    }

    .step {
      padding: 8px;
      margin-top: 5px;
      border-left: 4px solid #0b3d91;
      background: #f1f5ff;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="box">

    <h2>📦 Track Your Shipment</h2>

    <input id="trackingInput" placeholder="Enter Tracking Number">
    <button id="trackBtn">Track Package</button>

  </div>

  <div id="result"></div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
