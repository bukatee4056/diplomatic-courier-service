<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Global Shipment Tracking</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0f1c;
  color:white;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.header{
  background:#111a2e;
  padding:20px;
  border-radius:12px;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#f5c542;
  font-weight:bold;
}

.card{
  margin-top:20px;
  background:#111a2e;
  padding:20px;
  border-radius:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.box{
  background:#0f172a;
  padding:10px;
  border-radius:10px;
}

.label{color:#9aa4b2;font-size:12px;}
.value{font-size:14px;margin-top:3px;}

.step{
  padding:10px;
  margin-top:5px;
  border-left:4px solid #334155;
  background:#0b1220;
  opacity:0.4;
  border-radius:6px;
}

.step.active{
  opacity:1;
  border-left:4px solid #22c55e;
}

#map{
  height:300px;
  margin-top:15px;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>📦 Global Shipment Tracking</h2>
<input id="trackingInput" placeholder="Enter Tracking Number">
<button id="trackBtn">Track Package</button>
</div>

<div id="result"></div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
