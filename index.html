<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shipment Tracking</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1c;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.header {
  background: #111a2e;
  padding: 20px;
  border-radius: 12px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #f5c542;
  border: none;
  border-radius: 8px;
  font-weight: bold;
}

.card {
  margin-top: 20px;
  background: #111a2e;
  padding: 20px;
  border-radius: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.box {
  background: #0f172a;
  padding: 10px;
  border-radius: 10px;
}

.label {
  font-size: 12px;
  color: #9aa4b2;
}

.value {
  font-size: 15px;
  margin-top: 3px;
}

.timeline {
  margin-top: 15px;
}

.step {
  padding: 10px;
  margin-top: 6px;
  border-left: 4px solid #334155;
  background: #0b1220;
  opacity: 0.4;
  border-radius: 6px;
}

.step.active {
  opacity: 1;
  border-left: 4px solid #22c55e;
}

.map {
  height: 250px;
  margin-top: 15px;
  border-radius: 10px;
  background: #0b1220;
}

.btn {
  margin-top: 15px;
  background: #2563eb;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>📦 Track Shipment</h2>
    <input id="trackingInput" placeholder="Enter Tracking Number">
    <button id="trackBtn">Track Package</button>
  </div>

  <div id="result"></div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
